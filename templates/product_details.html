<!DOCTYPE html>
<html>

<head>
    <title>{{ product.product_name }}</title>
</head>

<body>

<h1>{{ product.product_name }}</h1>

<img src="{{ url_for('static',
filename='images/' + product.image) }}"
width="300">

<h2>₹{{ product.price }}</h2>

<p>Category : {{ product.category }}</p>

<p>Stock : {{ product.stock }}</p>

<form action="/add_product_cart" method="POST">

    <input type="hidden"
           name="product_name"
           value="{{ product.product_name }}">

    <input type="hidden"
           name="price"
           value="{{ product.price }}">

    <button type="submit">
        Add To Cart
    </button>

</form>

</body>
</html>
