<!DOCTYPE html>
<html>

<head>

<title>MallHub Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f7fb;
}

.header{
background:#111827;
color:white;
padding:20px;
text-align:center;
}

.dashboard{
width:95%;
margin:30px auto;
}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;

}

.card{

background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.card h2{

font-size:40px;
margin:15px 0;
color:#2563eb;

}

.chart{

margin-top:50px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.buttons{

margin-top:40px;
display:flex;
gap:20px;
flex-wrap:wrap;

}

.buttons a{

padding:15px 30px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;

}

</style>

</head>

<body>

<div class="header">

<h1>MallHub Admin Dashboard</h1>

</div>

<div class="dashboard">

<div class="cards">

<div class="card">

<h3>Users</h3>

<h2>{{ users }}</h2>

</div>

<div class="card">

<h3>Products</h3>

<h2>{{ products }}</h2>

</div>

<div class="card">

<h3>Movie Bookings</h3>

<h2>{{ bookings }}</h2>

</div>

<div class="card">

<h3>Revenue</h3>

<h2>₹{{ revenue }}</h2>

</div>

<div class="card">

<h3>Reviews</h3>

<h2>{{ reviews }}</h2>

</div>

<div class="card">

<h3>Food Orders</h3>

<h2>{{ food_orders }}</h2>

</div>

</div>

<div class="chart">

<canvas id="salesChart"></canvas>

</div>

<div class="buttons">

<a href="/admin_movies">

🎬 Manage Movies

</a>

<a href="/admin_products">

🛒 Manage Products

</a>

<a href="/movie_history">

🎟 Movie Bookings

</a>

<a href="/dashboard">

🏠 User Dashboard

</a>

</div>

</div>

<script>

new Chart(document.getElementById("salesChart"),{

type:"bar",

data:{

labels:[
"Users",
"Products",
"Bookings",
"Reviews"
],

datasets:[{

label:"MallHub Statistics",

data:[
{{ users }},
{{ products }},
{{ bookings }},
{{ reviews }}
]

}]

}

});

</script>

</body>

</html>
