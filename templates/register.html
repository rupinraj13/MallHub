<!DOCTYPE html>
<html>

<head>

<title>MallHub Registration</title>

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#2ecc71,#3498db);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.register-box {

    background:white;
    width:400px;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0px 10px 25px rgba(0,0,0,0.2);

}


h1 {
    color:#2c3e50;
}


input {

    width:90%;
    padding:12px;
    margin:8px;
    border-radius:8px;
    border:1px solid #ccc;

}


button {

    width:95%;
    padding:12px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}


button:hover {

    background:#219150;

}


a {

    text-decoration:none;

}

</style>

</head>


<body>


<div class="register-box">


<h1>🏬 MallHub Register</h1>


<form method="POST">


<input
type="text"
name="fullname"
placeholder="Full Name"
required>


<input
type="email"
name="email"
placeholder="Email Address"
required>


<input
type="text"
name="phone"
placeholder="Phone Number"
required>


<input
type="password"
name="password"
placeholder="Create Password"
required>


<button type="submit">
Create Account
</button>


</form>


<br>


<a href="/login">
Already have an account? Login
</a>


</div>


</body>

</html>
