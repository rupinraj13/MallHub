<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Combo | MallHub Cinema</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.header{
background:#111827;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
margin:30px auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:150px;
height:150px;
object-fit:cover;
margin-bottom:15px;
}

.price{
font-size:22px;
color:#27ae60;
font-weight:bold;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#e50914;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#c40812;
}

.skip{
display:block;
width:250px;
margin:40px auto;
text-align:center;
background:#2563eb;
color:white;
padding:15px;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<h1>🍿 Choose Your Food Combo</h1>

<p>Add snacks to enjoy your movie.</p>

</div>

<div class="container">

<div class="grid">

<div class="card">

<img src="{{ url_for('static', filename='food/popcorn.png') }}">

<h2>Popcorn</h2>

<p class="price">₹200</p>

<form action="/movie_payment_page" method="POST">

<input type="hidden" name="food" value="Popcorn">

<input type="hidden" name="price" value="200">

<button>Add</button>

</form>

</div>

<div class="card">

<img src="{{ url_for('static', filename='food/combo.png') }}">

<h2>Popcorn + Coke</h2>

<p class="price">₹350</p>

<form action="/movie_payment_page" method="POST">

<input type="hidden" name="food" value="Popcorn + Coke">

<input type="hidden" name="price" value="350">

<button>Add</button>

</form>

</div>

<div class="card">

<img src="{{ url_for('static', filename='food/burger.png') }}">

<h2>Burger Combo</h2>

<p class="price">₹450</p>

<form action="/movie_payment_page" method="POST">

<input type="hidden" name="food" value="Burger Combo">

<input type="hidden" name="price" value="450">

<button>Add</button>

</form>

</div>

</div>

<a href="/movie_payment_page" class="skip">

Skip Food →

</a>

</div>

</body>
</html>
