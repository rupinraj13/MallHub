<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>MallHub AI Assistant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#eef3f8;
}

.header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
}

.container{
width:70%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

textarea{
width:100%;
height:120px;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
resize:none;
}

button{
margin-top:20px;
width:100%;
padding:15px;
background:#3498db;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

.answer{
margin-top:30px;
background:#f4f6f9;
padding:20px;
border-radius:10px;
}

.back{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#3498db;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<h1>
🤖 MallHub AI Shopping Assistant
</h1>

</div>

<div class="container">

<form method="POST">

<textarea
name="question"
placeholder="Ask something...
Example:
Show me shoes under ₹3000
Suggest a phone
Best electronics">
</textarea>

<button>
Ask AI
</button>

</form>

{% if answer %}

<div class="answer">

<h2>
AI Answer
</h2>

<br>

<p>

{{ answer }}

</p>

</div>

{% endif %}

<a href="/dashboard" class="back">

⬅ Dashboard

</a>

</div>

</body>

</html>
